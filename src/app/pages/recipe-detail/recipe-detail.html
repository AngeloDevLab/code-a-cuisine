<main class="recipe-detail">
    <app-logo />
    <app-back-link class="recipe-detail__back" [target]="back().path" [label]="back().label" />

    @if (recipe(); as recipe) {
    <article class="recipe-detail__card">
        <app-recipe-summary [recipe]="recipe" />
        <app-recipe-ingredients class="recipe-detail__section" [recipe]="recipe" />
        <app-recipe-steps class="recipe-detail__section" [recipe]="recipe" />
        <app-recipe-like class="recipe-detail__like" [recipeId]="recipe.id" />
    </article>
    } @else if (!loaded.isLoading()) {
    <section class="recipe-detail__missing">
        <h1 class="recipe-detail__missing-title">Recipe not found</h1>
        <p>This recipe is no longer available. Generate a new one or browse the cookbook.</p>
    </section>
    }

    <aside class="recipe-detail__teaser">
        <p class="recipe-detail__teaser-text">Find inspiration for your next culinary adventure!</p>
        <a class="recipe-detail__cookbook" appButton label="Cookbook" routerLink="/cookbook"></a>
    </aside>

    <a class="recipe-detail__new" appButton label="Generate new recipe" variant="text" arrow routerLink="/generator"></a>

    <app-legal-links />
</main>
