<main class="hero">
    <div class="hero__content">
        <app-logo variant="creamy" />

        <div class="hero__intro">
            <p class="hero__tagline">AI-Powered<br class="hero__break" /> recipe generator</p>
            <h1 class="hero__title">Code à<br class="hero__break" /> Cuisine</h1>
            <a class="hero__cta" appButton label="Get started" tone="creamy" routerLink="/generator"></a>
        </div>

        <div class="hero__teaser">
            <p class="hero__teaser-text">Hungry for<br class="hero__break hero__break--tablet" /> inspiration?</p>
            <a class="hero__link" appButton label="Go to cookbook" variant="text" tone="creamy" arrow
                routerLink="/cookbook"></a>
        </div>

        <div class="hero__images">
            <img class="hero__image" ngSrc="images/hero-1.webp" alt="" width="940" height="940" priority />
            <img class="hero__image hero__image--rotated" ngSrc="images/hero-2.webp" alt="" width="940" height="940" priority />
            <img class="hero__image" ngSrc="images/hero-3.webp" alt="" width="940" height="940" priority />
            <img class="hero__image hero__image--wide" ngSrc="images/hero-4.webp" alt="" width="940" height="940" />
            <img class="hero__image hero__image--wide" ngSrc="images/hero-5.webp" alt="" width="940" height="940" />
            <img class="hero__image hero__image--uhd" ngSrc="images/hero-1.webp" alt="" width="940" height="940" />
            <img class="hero__image hero__image--uhd" ngSrc="images/hero-2.webp" alt="" width="940" height="940" />
        </div>

        <app-legal-links class="hero__legal" />
    </div>
</main>
